name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Matches gradle/gradle-daemon-jvm.properties (JDK 25).
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # Constitution Principles I-III: no schedulers, no broad package visibility, no silent installs.
      - name: Policy gates
        run: |
          if grep -rEn "WorkManager|AlarmManager|JobScheduler|BOOT_COMPLETED|startForegroundService|QUERY_ALL_PACKAGES|UPDATE_PACKAGES_WITHOUT_USER_ACTION" app/src core/src; then
            echo "::error::Forbidden API or permission found (see constitution Principles I-III)"
            exit 1
          fi

      - name: Unit tests and Lint
        run: ./gradlew test lint :app:assembleDebug :app:assembleRelease --stacktrace

      # The built APK, not the source manifest, is what users get: libraries can add permissions.
      # AndroidX Core always adds its own signature-level DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION; it is
      # private to this app and grants nothing (constitution 1.0.1), so it is the one allowed extra.
      - name: Release APK permissions
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          perms=$("$aapt2" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk \
            | grep '^uses-permission' | sed "s/.*name='//;s/'.*//" \
            | grep -v '^io\.github\.kolod\.updater\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$' \
            | sort | xargs)
          expected="android.permission.INTERNET android.permission.REQUEST_INSTALL_PACKAGES"
          if [ "$perms" != "$expected" ]; then
            echo "::error::Unexpected permissions in the release APK: $perms"
            exit 1
          fi
